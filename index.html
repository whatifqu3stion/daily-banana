<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- SEO: Optimized Title -->
    <title>The Daily Banana | AI Newspaper Comic Generator</title>

    <!-- SEO: Meta Description -->
    <meta name="description" content="Create retro, full-color newspaper-style comic strips with The Daily Banana. Use our AI comic generator, powered by Gemini, to bring your stories to life." />
    
    <script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@^19.0.0",
    "react-dom/client": "https://esm.sh/react-dom@^19.0.0/client",
    "html-to-image": "https://esm.sh/html-to-image@^1.11.11",
    "@google/genai": "https://esm.sh/@google/genai",
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.1.1/",
    "react/": "https://aistudiocdn.com/react@^19.1.1/"
  }
}
</script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Lora:ital,wght@0,400..700;1,400..700&family=Manufacturing+Consent&family=Special+Elite&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS Play CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              'newsprint': '#EFE4C9',
              'paper-light': '#F9F6EE',
              'banana': '#FACC15',
            },
            fontFamily: {
              // Set Lora as the default sans-serif font
              sans: ['Lora', 'serif'],
              bangers: ['Bangers', 'cursive'],
              lora: ['Lora', 'serif'],
              'special-elite': ['"Special Elite"', 'cursive'],
              masthead: ['"Manufacturing Consent"', 'serif'],
            },
            letterSpacing: {
              'extrawidest': '.3em',
            },
            borderWidth: {
              '3': '3px',
            },
            keyframes: {
              'spin-once': {
                'from': { transform: 'rotate(0deg)' },
                'to': { transform: 'rotate(360deg)' },
              }
            },
            animation: {
              'spin-once': 'spin-once 0.5s linear 1',
            }
          },
        },
      }
    </script>
    
    <style>
      body {
        background-color: #EFE4C9; /* Base newsprint color */
        position: relative;
        z-index: 0;
      }

      /* Create a pseudo-element to hold the fading dot pattern */
      body::before {
        content: '';
        position: absolute; /* Changed from 'fixed' to 'absolute' to scroll with the page */
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: -1;
        pointer-events: none;
        /* Subtle halftone dot pattern */
        background-image: radial-gradient(circle, rgba(0, 0, 0, 0.07) 2px, transparent 2px);
        background-size: 8px 8px;
        /* Apply a vertical mask to fade ONLY the dots in from top to bottom */
        mask-image: linear-gradient(to bottom, transparent 25%, black 100%);
        -webkit-mask-image: linear-gradient(to bottom, transparent 25%, black 100%);
      }
      
      /* Masthead title: stretch text to match subtitle width + halftone overlay */
      .masthead-title {
        text-align: justify;
        text-align-last: justify;
        text-justify: inter-character;
        display: block;
        width: 100%;
        position: relative;
        isolation: isolate;
      }
      .masthead-title::after {
        content: '';
        position: absolute;
        inset: -4px;
        background-image: radial-gradient(circle, rgba(255,255,255,0.55) 1.5px, transparent 1.5px);
        background-size: 5px 5px;
        mix-blend-mode: screen;
        pointer-events: none;
      }

      /* Custom animation that is not part of Tailwind */
      .blinking-cursor {
        font-weight: 100;
        animation: 1s blink step-end infinite;
      }
      @keyframes blink {
        from, to { color: transparent; }
        50% { color: black; }
      }
    </style>
</head>
<body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
</body>
</html>
