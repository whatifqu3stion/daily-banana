    <style>
      html {
        background-color: #F3EAD3; /* Paper texture color */
      }
      body {
        font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", sans-serif, "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol", "Noto Color Emoji";
        position: relative; /* Required for the ::before pseudo-element */
        background-color: transparent; /* Allow html background to show through */
      }
      body::before {
        content: '';
        position: fixed; /* Changed to fixed for viewport-relative masking */
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        z-index: -1;
        background-image: radial-gradient(#D5CBB2 1.5px, transparent 1.5px), radial-gradient(#D5CBB2 1.5px, transparent 1.5px);
        background-size: 16px 16px;
        background-position: 0 0, 8px 8px;
        /* A mask fades the pattern in from the middle of the screen */
        mask-image: linear-gradient(to bottom, rgba(0,0,0,0) 50%, rgba(0,0,0,1) 75%);
        -webkit-mask-image: linear-gradient(to bottom, rgba(0,0,0,0) 50%, rgba(0,0,0,1) 75%);
      }
      .font-lora {
        font-family: 'Lora', serif;
      }
      .font-bangers {
        font-family: 'Bangers', cursive;
      }
      .font-special-elite {
        font-family: 'Special Elite', monospace;
      }
      .tail-handle {
        position: absolute;
        width: 16px;
        height: 16px;
        background: black;
        border: 2px solid white;
        border-radius: 50%;
        cursor: grab;
        transform: translate(-50%, -50%);
        opacity: 0;
        transition: opacity 0.2s;
        z-index: 20; /* Ensure handle is on top */
      }
      .group:hover .tail-handle {
        opacity: 1;
      }
      .tail-handle:active {
        cursor: grabbing;
      }
      /* Override browser autofill styles that turn the topic input gray */
      input:-webkit-autofill,
      input:-webkit-autofill:hover,
      input:-webkit-autofill:focus,
      input:-webkit-autofill:active {
          -webkit-text-fill-color: #000;
          /* Use the same color as bg-stone-100 */
          -webkit-box-shadow: 0 0 0px 1000px #f5f5f4 inset;
          transition: background-color 5000s ease-in-out 0s;
          font-family: 'Special Elite', monospace;
      }

      /* Delightful button interaction */
      .generate-button {
        transition: transform 0.15s ease-out, box-shadow 0.15s ease-out, background-color 0.15s ease-out;
      }

      .generate-button:hover, .generate-button:focus-visible {
        transform: translate(-5px, -5px);
        box-shadow: 5px 5px 0 0 black;
        background-color: #FACC15; /* Banana Yellow (yellow-400) */
        color: black;
      }

      .generate-button:active {
          transform: translate(-2px, -2px);
          box-shadow: 2px 2px 0 0 black;
      }

      /* Blinking cursor for typewriter effect */
      @keyframes blink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0; }
      }
      .blinking-cursor {
        animation: blink 1s step-end infinite;
      }
    </style>
